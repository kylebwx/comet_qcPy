[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comet-qc"
version = "1.0.0"
description = "Quality-control pipeline for CoMeT (Combined Mesonet and Tracker) meteorological data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "University of Nebraska-Lincoln / Central Michigan University" },
]
keywords = ["meteorology", "mobile mesonet", "quality control", "netcdf"]

dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
]

[project.optional-dependencies]
netcdf = ["netCDF4>=1.6"]
scipy  = ["scipy>=1.10"]
all    = ["netCDF4>=1.6", "scipy>=1.10"]

[project.scripts]
comet-qc = "comet_qc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["comet_qc*"]
